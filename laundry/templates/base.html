<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cond & Lav{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .card {
            margin-bottom: 1.5rem;
        }
    </style>

<script>
    // Função para redirecionar para o logout
    function autoLogout() {
        window.location.href = "{% url 'laundry:login' %}"; // Ou a URL de login se preferir
    }

    // Configura um temporizador para 1 minuto (60.000 milissegundos)
    // Se a página ficar parada por 1 min, ele executa o logout
    let idleTimer = setTimeout(autoLogout, 60000);

    // Opcional: Se quiser ser "bonzinho" e resetar o timer se o mouse mexer:
    // (Cuidado: Se o usuário mexer o mouse mas não clicar em nada,
    // a sessão do servidor PODE expirar mesmo assim se não houver refresh.
    // Para 1 minuto rigoroso, eu recomendo NÃO usar o reset abaixo,
    // ou usar AJAX para renovar a sessão, o que é mais complexo).
</script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">Cond&Lav</a>
            {% if request.session.inquilino_id %}
                <a href="{% url 'laundry:logout' %}" class="btn btn-outline-light btn-sm">Sair</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
