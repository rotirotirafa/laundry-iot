{% extends 'base.html' %}

{% block title %}Login - Lavanderia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Acessar Sistema</h2>
                <form method="post" action="{% url 'laundry:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="identificador" class="form-label">Seu Identificador</label>
                        <input type="text" class="form-control" id="identificador" name="identificador" placeholder="Ex: APTO-101" required>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
