<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login Lavanderia</h1>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li style="color: red;">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="apartamento">Número do Apartamento:</label><br>
        <input type="text" id="apartamento" name="apartamento" required><br><br>
        
        <label for="password">Senha:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <input type="submit" value="Entrar">
    </form>
    <p><small>Se este é seu primeiro acesso, ou se você esqueceu sua senha, digite uma nova senha. Ela será salva para futuros acessos.</small></p>
</body>
</html>
