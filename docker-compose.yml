services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: IJmUjBt4
      POSTGRES_DB: laundry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laundry_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d laundry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  laundry-iot:
    build: .
    container_name: laundry_iot_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database configuration
      DB_NAME: laundry_db
      DB_USER: user
      DB_PASS: IJmUjBt4
      DB_HOST: postgres
      DB_PORT: 5432
      # Django superuser configuration (opcional)
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    networks:
      - laundry_network
    restart: always

networks:
  laundry_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
