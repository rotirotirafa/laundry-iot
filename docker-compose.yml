services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: IJmUjBt4
      POSTGRES_DB: laundry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laundry_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d laundry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

